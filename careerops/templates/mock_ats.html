<!doctype html><html><head><meta charset='utf-8'><title>Mock ATS</title><link rel='stylesheet' href='/static/styles.css'></head><body class='mock'><div class='mock-card'><span class='eyebrow'>LOCAL TEST PORTAL</span><h1>{{job.company}}</h1><h2>{{job.title}}</h2><p>This local form lets CareerOps prove the Playwright application agent without submitting to a real employer.</p><form method='post' action='/mock-ats/submit/{{job.id}}'><label>First Name<input name='first_name' aria-label='First Name' required></label><label>Last Name<input name='last_name' aria-label='Last Name' required></label><label>Email Address<input name='email' aria-label='Email Address' type='email' required></label><label>Phone Number<input name='phone' aria-label='Phone Number'></label><label>LinkedIn Profile<input name='linkedin' aria-label='LinkedIn Profile'></label><label>Voluntary self-identification of disability<select name='disability' aria-label='Voluntary self-identification of disability'><option>Prefer not to answer</option><option>Yes</option><option>No</option></select></label><button class='btn'>Submit Application</button></form></div></body></html>
