<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>{% block title %}CareerOps{% endblock %}</title><link rel='stylesheet' href='/static/styles.css'></head>
<body><div class='shell'><aside><div class='brand'><div class='logo'>C</div><div><strong>CareerOps</strong><span>Job Search Control Tower</span></div></div><nav><a href='/' class='{% if request.url.path=="/" %}active{% endif %}'>⌂ Dashboard</a><a href='/profile' class='{% if request.url.path=="/profile" %}active{% endif %}'>◎ Candidate Profile</a><a href='/journal' class='{% if request.url.path=="/journal" %}active{% endif %}'>✎ Build Journal</a><a href='/applications' class='{% if request.url.path.startswith("/applications") %}active{% endif %}'>✓ Applications</a><a href='/notifications' class='{% if request.url.path.startswith("/notifications") %}active{% endif %}'>◉ Notifications</a><a href='/docs'>◇ API Docs</a></nav><div class='aside-note'><span class='dot'></span> Local runtime active<br><small>AWS-ready • FastAPI • Agents</small></div></aside><main>{% block content %}{% endblock %}</main></div><script src='/static/app.js'></script></body></html>
