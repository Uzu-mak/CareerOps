# Non-secret settings for Cloud Run. Copy to env.yaml (git-ignored) and edit.
# Secrets (DATABASE_URL, SECRET_KEY, GOOGLE_CLIENT_SECRET, OPENAI_API_KEY, ...)
# go in Secret Manager and are attached with --set-secrets; see docs/deploy-gcp.md.
ENVIRONMENT: production
AUTH_MODE: google
BASE_URL: https://careerops-XXXXXXXXXX-uw.a.run.app
GOOGLE_CLIENT_ID: 1234567890-abc.apps.googleusercontent.com
ALLOWED_EMAILS: you@gmail.com
SESSION_HOURS: "12"
LLM_PROVIDER: openai
OPENAI_MODEL: gpt-4o-mini
UPLOADS_DIR: /data/uploads
GENERATED_DIR: /data/generated
CHROMIUM_EXECUTABLE: /usr/bin/chromium
BROWSER_HEADLESS: "true"
AUTO_SUBMIT_ENABLED: "false"
SEED_DEMO_JOBS: "false"
DEMO_HOME_LOCATION: Seattle, WA
