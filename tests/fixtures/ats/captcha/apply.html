<!doctype html><html><head><meta charset="utf-8"><title>Apply</title></head><body>
<form id="f" onsubmit="return false">
  <label>First name * <input name="first" required></label>
  <label>Last name * <input name="last" required></label>
  <label>Email * <input name="email" type="email" required></label>
  <label>Resume * <input name="resume" type="file" required></label>
  <button type="submit" id="go">Submit Application</button>
</form>
<script>
document.getElementById('go').addEventListener('click', () => {
  // Bot score too low: reCAPTCHA escalates to an image challenge.
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:absolute;top:80px;left:40px;visibility:visible';
  wrap.innerHTML = '<iframe title="recaptcha challenge expires in two minutes" src="../recaptcha/api2/bframe.html?k=x" width="400" height="580"></iframe>';
  document.body.appendChild(wrap);
});
</script></body></html>
