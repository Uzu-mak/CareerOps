<!doctype html><html><head><meta charset="utf-8"><title>Apply</title></head><body>
<!-- A form whose Submit is quietly refused (as when a hidden bot check fails): nothing changes, no error. -->
<h1>Backend Engineer</h1>
<form id="f" onsubmit="return false">
  <label for="n">Name *</label><input id="n" name="name" required>
  <label for="e">Email *</label><input id="e" name="email" type="email" required>
  <label for="w">Website</label><input id="w" name="website">
  <label for="p">Pronouns</label><select id="p" name="pronouns"><option value="">Select...</option><option>she/her</option><option>he/him</option><option>they/them</option></select>
  <button type="submit">Submit Application</button>
</form></body></html>
