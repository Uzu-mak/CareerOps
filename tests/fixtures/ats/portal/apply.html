<!doctype html><html><head><meta charset="utf-8"><title>Initrode Careers</title></head><body>
<div id="app"></div>
<script>
// A big-company portal: the application only exists for signed-in users.
const signedIn = document.cookie.split('; ').includes('portal_session=valid');
document.getElementById('app').innerHTML = signedIn ? `
  <h1>Apply: Platform Engineer</h1>
  <form id="f" onsubmit="return false">
    <label>First name * <input name="first" required></label>
    <label>Last name * <input name="last" required></label>
    <label>Email * <input name="email" type="email" required></label>
    <label>Resume * <input name="resume" type="file" required></label>
    <label>Which university did you attend? * <select name="school" required><option value="">Select…</option><option>Stanford University</option><option>Other (School Not Listed)</option></select></label>
    <label>Graduation year * <select name="grad" required><option value="">Select…</option><option>2025</option><option>2026</option><option>2027</option></select></label>
    <button type="submit" id="go">Submit Application</button>
  </form>` : `
  <h1>Sign in to continue</h1><p>Create an account or sign in to apply.</p>
  <form><label>Email <input name="email" type="email"></label><label>Password <input name="password" type="password"></label><button type="button">Sign in</button></form>`;
document.getElementById('go')?.addEventListener('click', () => {
  const fd = new FormData(document.getElementById('f'));
  if (!fd.get('first') || !fd.get('school') || !fd.get('grad') || !document.querySelector('[name=resume]').files.length) return;
  history.pushState({}, '', '?' + new URLSearchParams({ school: fd.get('school'), grad: fd.get('grad') }));
  document.getElementById('app').innerHTML = '<h2>Thank you for applying!</h2>';
});
</script></body></html>
